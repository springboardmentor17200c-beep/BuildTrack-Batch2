<div class="shell">
  <div class="shell__backdrop" *ngIf="sidebarMobileOpen()" (click)="closeMobileSidebar()"></div>
  <app-sidebar
    [open]="sidebarMobileOpen()"
    [collapsed]="sidebarCollapsed()"
    (linkClick)="closeMobileSidebar()"
    (toggleCollapse)="toggleSidebar()"
  ></app-sidebar>
  <div class="shell__main">
    <app-topbar [title]="pageTitle()" [sidebarCollapsed]="sidebarCollapsed()" (menuClick)="toggleSidebar()"></app-topbar>
    <div class="shell__content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
