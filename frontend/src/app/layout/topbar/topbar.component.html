<header class="topbar">
  <div class="topbar__title">
    <button class="topbar__menu" (click)="menuClick.emit()"><i class="fa-solid fa-bars"></i></button>
    <h2>{{ title }}</h2>
  </div>

  <div class="topbar__right">
    <div class="topbar__search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input
        type="text"
        placeholder="Search anything..."
        [ngModel]="query()"
        (ngModelChange)="query.set($event)"
        (focus)="onFocus()"
        (blur)="onBlur()"
      />

      <div class="search-results" *ngIf="showResults() && query().trim()">
        <ng-container *ngIf="results().length; else noResults">
          <div class="search-results__item" *ngFor="let r of results()" (click)="goTo(r)">
            <i class="fa-solid" [ngClass]="r.icon"></i>
            <div>
              {{ r.label }}<br />
              <small>{{ r.sub }}</small>
            </div>
          </div>
        </ng-container>
        <ng-template #noResults>
          <div class="search-results__empty">No results for "{{ query() }}"</div>
        </ng-template>
      </div>
    </div>

    <div class="topbar__notification-wrapper">
      <button class="topbar__icon-btn" (click)="toggleNotifications($event)" title="Notifications">
        <i class="fa-regular fa-bell"></i>
        <span class="badge-count" *ngIf="notificationService.unreadCount() > 0">
          {{ notificationService.unreadCount() }}
        </span>
      </button>

      <!-- Dropdown Panel -->
      <div class="notification-dropdown" *ngIf="showNotificationsPanel()">
        <div class="notification-dropdown__header">
          <h3>Notifications</h3>
          <button class="btn-text" (click)="markAllAsRead($event)" [disabled]="notificationService.unreadCount() === 0">
            Mark all read
          </button>
        </div>

        <div class="notification-dropdown__body">
          <div *ngIf="notificationService.notifications().length === 0" class="empty-state">
            <i class="fa-regular fa-bell-slash"></i>
            <p>No recent notifications</p>
          </div>

          <div
            *ngFor="let item of notificationService.notifications().slice(0, 3)"
            class="dropdown-item"
            [class.unread]="!item.is_read"
            (click)="onNotificationClick(item)"
          >
            <div class="dropdown-item__dot" *ngIf="!item.is_read"></div>
            <div class="dropdown-item__content">
              <div class="dropdown-item__title">{{ item.title }}</div>
              <div class="dropdown-item__time">{{ formatTime(item.created_at) }}</div>
            </div>
          </div>
        </div>

        <div class="notification-dropdown__footer">
          <button class="view-all-btn" (click)="viewAllNotifications()">
            View All Notifications
          </button>
        </div>
      </div>
    </div>

    <ng-container *ngIf="auth.currentUser() as user">
      <img class="topbar__avatar" [src]="user.avatarUrl || 'assets/default-avatar.svg'" alt="" />
    </ng-container>
  </div>
</header>
